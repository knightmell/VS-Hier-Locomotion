[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stable-baselines3"
version = "2.6.0a1"
description = "MIT-licensed SB3/DSRL locomotion subset for VS-Hier"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = ["gymnasium>=0.29.1,<1.3", "torch>=2.3,<3", "numpy>=1.20,<3", "cloudpickle", "pandas", "matplotlib"]

[tool.setuptools.packages.find]
include = ["stable_baselines3*"]

[tool.setuptools.package-data]
stable_baselines3 = ["version.txt", "py.typed"]
